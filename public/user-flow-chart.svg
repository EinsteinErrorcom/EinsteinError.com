<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 920" width="320" height="920" role="img" aria-label="MAX-LIT user flow top to bottom">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
    <style>
      .title { font: 600 13px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .detail { font: 400 11px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #475569; }
      .route  { font: 400 10px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #64748b; }
      .label  { font: 500 10px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #94a3b8; letter-spacing: 0.04em; }
      .heading { font: 600 15px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #0f172a; }
      .sub     { font: 400 11px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #64748b; }
    </style>
  </defs>
  <text x="160" y="28" text-anchor="middle" class="heading">MAX-LIT User Flow</text>
  <text x="160" y="48" text-anchor="middle" class="sub">TOP to BOTTOM</text>
  <rect x="10" y="64" width="300" height="68" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="24" y="86" class="title">1. HOMEPAGE</text>
  <text x="24" y="104" class="detail">Truth counter - entry point</text>
  <text x="24" y="120" class="route">/</text>
  <line x1="160" y1="132" x2="160" y2="152" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="10" y="152" width="300" height="68" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
  <text x="24" y="174" class="title">2. SIGN-IN</text>
  <text x="24" y="192" class="detail">Google Sign-In button</text>
  <text x="24" y="208" class="route">/#auth-section</text>
  <line x1="160" y1="220" x2="160" y2="240" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="10" y="240" width="300" height="68" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>
  <text x="24" y="262" class="title">3. CONTENT</text>
  <text x="24" y="280" class="detail">Marketing and proof pages</text>
  <text x="24" y="296" class="route">/page2 to /page7</text>
  <line x1="160" y1="308" x2="160" y2="328" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="10" y="328" width="300" height="68" rx="6" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1"/>
  <text x="24" y="350" class="title">4. STRIPE</text>
  <text x="24" y="368" class="detail">Pick tier - hosted checkout</text>
  <text x="24" y="384" class="route">/checkout10</text>
  <line x1="160" y1="396" x2="160" y2="416" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="10" y="416" width="300" height="68" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="24" y="438" class="title">5. CHATBOX</text>
  <text x="24" y="456" class="detail">MAX-LIT AI chat</text>
  <text x="24" y="472" class="route">/maxchatbox8</text>
  <line x1="160" y1="484" x2="160" y2="504" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="40" y1="518" x2="280" y2="518" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="160" y="536" text-anchor="middle" class="label">FOOTER CHAIN CONTINUES</text>
  <rect x="10" y="548" width="300" height="68" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1"/>
  <text x="24" y="570" class="title">6. TRIAL EXPIRED</text>
  <text x="24" y="588" class="detail">Free 1-hour trial ended</text>
  <text x="24" y="604" class="route">/trialexpired9</text>
  <line x1="160" y1="616" x2="160" y2="636" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="10" y="636" width="300" height="68" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
  <text x="24" y="658" class="title">7. TIME EXPIRED</text>
  <text x="24" y="676" class="detail">Cookie gate expired</text>
  <text x="24" y="692" class="route">/timeexpired11</text>
  <line x1="160" y1="704" x2="160" y2="724" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="10" y="724" width="300" height="68" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="24" y="746" class="title">8. SPARE</text>
  <text x="24" y="764" class="detail">Reserved placeholder</text>
  <text x="24" y="780" class="route">/spare12</text>
</svg>
